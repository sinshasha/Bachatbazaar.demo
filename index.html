<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f4ef">
  <title>BachatBazaar · Grocery bids</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #f2f4ef;
      --surface: #fff;
      --surface-soft: #e7ebe3;
      --line: #d3dace;
      --ink: #17201b;
      --muted: #5b685f;
      --green: #0e6b52;
      --green-soft: #ddefe6;
      --gold: #a86f00;
      --gold-soft: #fbefd2;
      --blue: #315c83;
      --blue-soft: #e4edf5;
      --orange: #a64a12;
      --orange-soft: #fbe7da;
      --shadow: 0 1px 2px rgb(20 40 30 / 6%), 0 8px 26px rgb(20 40 30 / 5%);
      --display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
      --body: "Figtree", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--bg); font: 15px/1.45 var(--body); font-variant-numeric: tabular-nums; }
    button, input { color: inherit; font: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
    h1, h2, h3, p { margin: 0; }
    h1, h2, h3 { font-family: var(--display); text-wrap: balance; }
    .topbar { min-height: 62px; display: flex; align-items: center; gap: 14px; padding: 10px 24px; border-bottom: 1px solid var(--line); background: rgb(242 244 239 / 94%); position: sticky; top: 0; z-index: 5; backdrop-filter: blur(12px); }
    .brand { font: 800 25px/1 var(--display); display: inline-flex; align-items: center; gap: 7px; }
    .brand-mark { width: 9px; height: 9px; background: var(--green); border-radius: 50%; margin-top: 8px; }
    .phase-label, .eyebrow { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .phase-label { border: 1px solid var(--line); border-radius: 99px; padding: 4px 9px; }
    .top-spacer { flex: 1; }
    .session-name { font-size: 13px; color: var(--muted); }
    .quiet-button { border: 0; background: transparent; color: var(--green); font-weight: 700; padding: 8px; }
    .login-wrap { width: min(100% - 32px, 980px); margin: 0 auto; padding: 52px 0 72px; }
    .login-intro { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(220px, .8fr); align-items: end; gap: 30px; margin-bottom: 30px; }
    .login-intro h1 { max-width: 620px; font-size: clamp(38px, 6vw, 64px); line-height: 1.02; font-weight: 800; }
    .login-intro h1 span { color: var(--green); }
    .login-intro p { max-width: 38ch; color: var(--muted); font-size: 16px; }
    .role-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .role-card { text-align: left; min-height: 190px; display: flex; flex-direction: column; gap: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 13px; padding: 17px; box-shadow: var(--shadow); transition: transform .18s ease, border-color .18s ease; }
    .role-card:hover { transform: translateY(-3px); border-color: var(--green); }
    .role-icon { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 11px; background: var(--green-soft); color: var(--green); }
    .role-card[data-role="retailer"] .role-icon { background: var(--gold-soft); color: var(--gold); }
    .role-card[data-role="rider"] .role-icon { background: var(--blue-soft); color: var(--blue); }
    .role-card[data-role="ops"] .role-icon { background: var(--orange-soft); color: var(--orange); }
    .role-icon svg { width: 20px; height: 20px; }
    .role-card strong { display: block; font: 700 20px/1.1 var(--display); }
    .role-card small { display: block; margin-top: 5px; color: var(--muted); font-size: 13px; }
    .login-foot { display: flex; gap: 9px; align-items: center; margin-top: 20px; color: var(--muted); font-size: 13px; }
    .status-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; }
    .app-shell { width: min(100%, 1320px); min-height: calc(100dvh - 62px); margin: 0 auto; padding: 25px 24px 48px; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 27px; }
    .side { align-self: start; position: sticky; top: 85px; display: flex; flex-direction: column; gap: 20px; }
    .zone-card { border-radius: 12px; background: var(--green); color: white; padding: 16px; }
    .zone-card .eyebrow { color: #cce5d9; }
    .zone-card h2 { font-size: 21px; margin-top: 7px; }
    .zone-card p { margin-top: 3px; color: #e5f2eb; font-size: 13px; }
    .side-nav { display: flex; flex-direction: column; gap: 4px; }
    .nav-button { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; border: 0; border-radius: 9px; padding: 10px 11px; background: transparent; color: var(--muted); font-weight: 600; }
    .nav-button svg { width: 17px; height: 17px; }
    .nav-button:hover, .nav-button[aria-current="page"] { color: var(--ink); background: var(--surface); box-shadow: 0 1px 3px rgb(20 40 30 / 7%); }
    .side-note { border-top: 1px solid var(--line); padding-top: 14px; color: var(--muted); font-size: 12px; }
    .main-content { min-width: 0; }
    .page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin: 2px 0 22px; }
    .page-head h1 { font-size: 34px; line-height: 1.05; margin-top: 5px; }
    .page-head p { color: var(--muted); margin-top: 7px; }
    .badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 5px 10px; background: var(--green-soft); color: var(--green); font-size: 12px; font-weight: 700; white-space: nowrap; }
    .badge.gold { background: var(--gold-soft); color: var(--gold); }
    .badge.blue { background: var(--blue-soft); color: var(--blue); }
    .badge.orange { background: var(--orange-soft); color: var(--orange); }
    .badge-dot { width: 6px; height: 6px; background: currentColor; border-radius: 50%; }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 11px; margin-bottom: 18px; }
    .stat { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 14px 15px; box-shadow: var(--shadow); }
    .stat span { display: block; color: var(--muted); font-size: 12px; font-weight: 600; }
    .stat strong { display: block; margin-top: 5px; font: 700 28px/1.1 var(--display); }
    .stat small { display: block; margin-top: 5px; color: var(--muted); font-size: 11px; }
    .columns { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(280px, .85fr); gap: 15px; }
    .panel { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 17px; border-bottom: 1px solid var(--line); }
    .panel-head h2 { font-size: 18px; }
    .panel-body { padding: 16px 17px; }
    .readiness { display: flex; flex-direction: column; gap: 15px; }
    .readiness-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .readiness-label { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .readiness-icon { flex: 0 0 auto; display: grid; place-items: center; width: 33px; height: 33px; border-radius: 9px; background: var(--surface-soft); color: var(--green); }
    .readiness-icon svg { width: 17px; height: 17px; }
    .readiness-label b { display: block; font-size: 14px; }
    .readiness-label small { color: var(--muted); font-size: 12px; }
    .divider { height: 1px; background: var(--line); }
    .field-list { display: flex; flex-direction: column; }
    .field-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
    .field-row:last-child { border-bottom: 0; }
    .field-row span { color: var(--muted); }
    .field-row strong { text-align: right; }
    .role-banner { display: flex; align-items: flex-start; gap: 13px; padding: 17px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
    .role-banner .role-icon { flex: 0 0 auto; }
    .role-banner h2 { font-size: 20px; }
    .role-banner p { color: var(--muted); margin-top: 4px; font-size: 13px; }
    .privacy-box { margin-top: 15px; border: 1px solid var(--line); border-radius: 11px; padding: 15px; background: var(--surface); }
    .privacy-box h3 { font: 700 13px var(--body); }
    .privacy-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }
    .privacy-columns span { display: block; margin-bottom: 7px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .privacy-columns p { font-size: 13px; }
    .privacy-columns .never { color: var(--orange); }
    .data-toolbar { display: flex; gap: 8px; flex-wrap: wrap; padding: 13px 16px; border-bottom: 1px solid var(--line); }
    .filter-button { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 7px 10px; font-size: 13px; font-weight: 600; }
    .filter-button[aria-pressed="true"] { border-color: var(--green); background: var(--green-soft); color: var(--green); }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 10px 14px; color: var(--muted); border-bottom: 1px solid var(--line); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
    td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    .n { text-align: right; }
    tbody tr:last-child td { border-bottom: 0; }
    .td-muted { color: var(--muted); }
    .config-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 22px; }
    .config-field { display: flex; flex-direction: column; gap: 6px; padding: 13px 0; border-bottom: 1px solid var(--line); }
    .config-field label { display: flex; justify-content: space-between; gap: 9px; font-size: 13px; font-weight: 700; }
    .config-field small { color: var(--muted); font-size: 12px; }
    .config-field input { width: 100%; max-width: 190px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 8px 10px; }
    .config-field input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--green); margin-right: auto; }
    .config-actions { display: flex; justify-content: flex-end; gap: 8px; padding-top: 16px; }
    .button { border: 1px solid var(--line); border-radius: 9px; padding: 9px 13px; background: var(--surface); font-weight: 700; }
    .button:hover { border-color: var(--muted); }
    .button.primary { border-color: var(--green); background: var(--green); color: white; }
    .button.primary:hover { filter: brightness(1.06); }
    .toast { position: fixed; right: 18px; bottom: 18px; z-index: 10; max-width: min(390px, calc(100vw - 36px)); padding: 11px 15px; border-radius: 9px; background: var(--ink); color: white; box-shadow: var(--shadow); font-weight: 600; animation: toast-in .18s ease-out; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    .empty-state { padding: 26px 18px; text-align: center; color: var(--muted); }
    .notice { border-left: 3px solid var(--gold); padding: 10px 12px; background: var(--gold-soft); color: #604500; border-radius: 0 8px 8px 0; font-size: 13px; }
    .voice-order { margin: 15px 0; padding: 17px; border-radius: 13px; background: #14251d; color: #f3f5ef; box-shadow: var(--shadow); }
    .voice-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .voice-top h2 { font-size: 20px; }
    .voice-top p { margin-top: 4px; color: #b8c8bd; font-size: 13px; }
    .language-switch { flex: 0 0 auto; display: inline-flex; gap: 2px; border: 1px solid #52665a; border-radius: 9px; padding: 3px; }
    .language-switch button { border: 0; border-radius: 6px; padding: 6px 8px; background: transparent; color: #d1dcd4; font-size: 11px; font-weight: 700; }
    .language-switch button[aria-pressed="true"] { background: #f5bf47; color: #18251d; }
    .voice-input-row { display: flex; align-items: center; gap: 11px; margin-top: 15px; }
    .voice-mic { flex: 0 0 auto; width: 46px; height: 46px; display: grid; place-items: center; border: 0; border-radius: 50%; background: #f5bf47; color: #17251d; font-size: 20px; }
    .voice-mic[aria-pressed="true"] { box-shadow: 0 0 0 5px rgb(245 191 71 / 23%); animation: voice-pulse 1.15s ease-in-out infinite; }
    @keyframes voice-pulse { 50% { transform: scale(1.06); } }
    .voice-input-row textarea { flex: 1; min-width: 0; min-height: 70px; resize: vertical; border: 1px solid #52665a; border-radius: 9px; padding: 9px 10px; background: #1d3026; color: #f3f5ef; }
    .voice-input-row textarea::placeholder { color: #a9b9ae; }
    .voice-sample { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; color: #f5cf75; text-decoration: underline; text-underline-offset: 3px; padding: 8px 0 0; font-size: 12px; }
    .voice-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
    .voice-button { border: 1px solid #9baaa0; border-radius: 8px; padding: 8px 11px; background: transparent; color: #f3f5ef; font-weight: 700; font-size: 13px; }
    .voice-button.primary { border-color: #f5bf47; background: #f5bf47; color: #17251d; }
    .voice-results { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 13px; }
    .voice-chip { display: inline-flex; align-items: center; gap: 7px; max-width: 100%; border: 1px solid #516357; border-radius: 8px; padding: 6px 8px; background: #20352a; color: #eff5ef; font-size: 12px; }
    .voice-chip.unknown { background: #45371d; border-color: #796334; color: #ffe19a; }
    .voice-chip button { border: 0; padding: 0 2px; background: transparent; color: inherit; font-size: 16px; line-height: 1; }
    .voice-empty { margin-top: 10px; color: #b8c8bd; font-size: 12px; }
    .voice-error { margin-top: 10px; color: #ffe19a; font-size: 12px; }
    @media (max-width: 900px) {
      .role-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .app-shell { grid-template-columns: 180px minmax(0, 1fr); gap: 18px; padding-inline: 18px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .columns { grid-template-columns: 1fr; }
    }
    @media (max-width: 620px) {
      .topbar { min-height: 56px; padding: 9px 15px; gap: 9px; }
      .brand { font-size: 23px; }
      .phase-label { font-size: 10px; }
      .session-name { display: none; }
      .login-wrap { width: min(100% - 28px, 480px); padding-top: 34px; }
      .login-intro { display: block; margin-bottom: 23px; }
      .login-intro h1 { font-size: 43px; }
      .login-intro p { margin-top: 14px; font-size: 15px; }
      .role-grid { grid-template-columns: 1fr 1fr; gap: 9px; }
      .role-card { min-height: 166px; padding: 13px; gap: 10px; }
      .role-card strong { font-size: 18px; }
      .role-card small { font-size: 12px; }
      .app-shell { display: block; padding: 18px 14px 34px; }
      .side { position: static; gap: 10px; margin-bottom: 20px; }
      .zone-card { padding: 12px 14px; }
      .zone-card h2 { font-size: 18px; }
      .zone-card p { display: inline; margin-left: 5px; }
      .side-nav { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
      .nav-button { justify-content: center; gap: 6px; padding: 9px 5px; font-size: 12px; }
      .side-note { display: none; }
      .page-head { align-items: flex-start; margin-bottom: 17px; }
      .page-head h1 { font-size: 29px; }
      .page-head p { font-size: 13px; }
      .page-head > .badge { margin-top: 19px; }
      .voice-order { padding: 14px; }
      .voice-top { flex-direction: column; }
      .language-switch { max-width: 100%; }
      .language-switch button { padding-inline: 7px; }
      .stats { gap: 8px; margin-bottom: 12px; }
      .stat { padding: 11px 12px; }
      .stat strong { font-size: 25px; }
      .panel-head, .panel-body { padding-inline: 13px; }
      .privacy-columns { grid-template-columns: 1fr; gap: 11px; }
      .config-grid { grid-template-columns: 1fr; }
      .config-field { flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; }
      .config-field > div { min-width: 0; }
      .config-field label { display: block; }
      .config-field input { max-width: 112px; }
      th, td { padding-inline: 10px; }
    }
    @media (max-width: 370px) {
      .role-grid { grid-template-columns: 1fr; }
      .role-card { min-height: 122px; display: grid; grid-template-columns: 40px 1fr; align-items: center; }
      .role-card > span:last-child { grid-column: 2; }
      .side-nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
  </style>

            ${fieldRow('Minimum basket', `₹${state.config.min_basket_value}`)}
            ${fieldRow('Customer delivery', `₹${state.config.delivery_fee}`)}
            ${fieldRow('Store commission', `${state.config.commission_percent}%`)}
            ${fieldRow('Bid window', `${state.config.bid_window_minutes} minutes`)}
            ${fieldRow('Slot capacity', `${state.config.slot_capacity} orders`)}
          </div>`, '<span class="badge">Local config</span>')}
        </div>`;
    }
    function fieldRow(label, value) { return `<div class="field-row"><span>${label}</span><strong>${value}</strong></div>`; }
    function roleOverview() {
      const role = state.account;
      const account = ACCOUNTS[role];
      const descriptions = {
        customer: ['Customer profile', 'Kothrud is open for launch. Your account is ready for the next product phase.'],
        retailer: ['Store profile', 'Your store is active in the Kothrud zone. This local session contains no customer identity records.'],
        rider: ['Rider profile', 'Your rider account is provisioned for Kothrud, Pune. Fulfilment tools are outside this phase.'],
        ops: ['Operations console', 'Seed records and launch configuration are available for this local foundation demo.']
      };
      const [heading, description] = descriptions[role];
      if (role === 'ops') return `${pageHeader('Foundation overview', 'Launch zone, seed data, and platform defaults.', '<span class="badge"><i class="badge-dot"></i>Local demo</span>')}${foundationSummary()}`;
      const roleStats = role === 'customer'
        ? `${stat('Zone', STORES.length >= state.config.min_stores_to_open ? 'Open' : 'Closed', 'Kothrud · 411038')}${stat('Nearby stores', '18', 'Active in your zone')}${stat('Catalogue', '150', 'Packaged grocery SKUs')}${stat('Fresh items', state.config.fresh_enabled ? 'On' : 'Off', 'Launch category flag')}`
        : role === 'retailer'
          ? `${stat('Store status', 'Active', 'Kothrud · 411038')}${stat('Zone stores', '18', 'Active retailer locations')}${stat('Seed catalogue', '150', 'Packaged grocery SKUs')}${stat('Customer data', 'None', 'Identity fields excluded')}`
          : `${stat('Account', 'Ready', 'Rider role provisioned')}${stat('Assigned zone', 'Kothrud', 'Pune · 411038')}${stat('Zone stores', '18', 'Active retailer locations')}${stat('Foundation', 'Phase 1', 'Fulfilment is not enabled')}`;
      const foundationPanels = `<div class="columns" style="margin-top:15px">${panel('Zone record', `<div class="field-list">${fieldRow('Zone', 'Kothrud, Pune')}${fieldRow('PIN code', '411038')}${fieldRow('Availability', STORES.length >= state.config.min_stores_to_open ? 'Open' : 'Closed')}${fieldRow('Minimum active stores', String(state.config.min_stores_to_open))}</div>`)}${panel('Seed coverage', `<div class="field-list">${fieldRow('Retailers', '18 active demo stores')}${fieldRow('Catalogue', '150 packaged FMCG SKUs')}${fieldRow('Fresh category', state.config.fresh_enabled ? 'Enabled' : 'Disabled')}${fieldRow('Data mode', 'Local mock data')}</div>`)}</div>`;
      const rolePanel = role === 'retailer'
        ? `<section class="privacy-box"><h3>Retailer data boundary</h3><div class="privacy-columns"><div><span>Permitted order fields</span><p>Order ID, items, quantities, requested brands, slot, zone</p></div><div><span>Never available</span><p class="never">Customer name, phone, address</p></div></div></section>`
        : role === 'customer' ? `${voiceOrderPanel()}${foundationPanels}` : foundationPanels;
      return `${pageHeader(heading, `Foundation access for ${account.name}.`, `<span class="badge"><i class="badge-dot"></i>Account ready</span>`)}<div class="role-banner">${roleIcon(role)}<div><h2>${account.name}</h2><p>${description}</p></div></div><div class="stats" style="margin-top:15px">${roleStats}</div>${rolePanel}`;
    }
    function storesTable() {
      return `<div class="table-scroll"><table><thead><tr><th>Store</th><th>Zone</th><th>Status</th><th>Store ID</th></tr></thead><tbody>${STORES.map((store, index) => `<tr><td><strong>${store}</strong></td><td class="td-muted">Kothrud · 411038</td><td><span class="badge"><i class="badge-dot"></i>Active</span></td><td class="td-muted">KT-${String(index + 1).padStart(3, '0')}</td></tr>`).join('')}</tbody></table></div>`;
    }
    function catalogueTable() {
      return `<div class="table-scroll"><table><thead><tr><th>SKU</th><th>Product / pack</th><th>Brand</th><th class="n">MRP</th><th class="n">Benchmark</th></tr></thead><tbody>${SKU_SEEDS.map(sku => `<tr><td class="td-muted">${sku.id}</td><td><strong>${sku.product}</strong><br><span class="td-muted">${sku.pack}</span></td><td>${sku.brand}</td><td class="n">₹${sku.mrp}</td><td class="n">₹${sku.benchmark}</td></tr>`).join('')}</tbody></table></div>`;
    }
    function schemaTable() {
      return `<div class="panel-body"><p class="sub">Foundation model: ${SCHEMA_TABLES.length} application tables. This page describes the local mock only; it does not create a database or enforce server-side policies.</p><div class="table-scroll" style="margin-top:12px"><table><thead><tr><th>Table</th><th>Mock contents</th></tr></thead><tbody>${SCHEMA_TABLES.map(table => `<tr><td><strong>${table}</strong></td><td class="td-muted">${table === 'users' ? 'Role-linked demo accounts' : table === 'skus' ? '150 packaged product, brand, pack and MRP records' : table === 'benchmark_prices' ? 'Per-SKU local benchmark values' : table === 'config' ? 'Launch defaults editable by Ops' : table === 'synonyms' ? `${SYNONYMS.length} seeded Hindi / Hinglish rules` : 'Foundation record shape'}</td></tr>`).join('')}</tbody></table></div><div class="privacy-box"><h3>Mock access boundary</h3><div class="privacy-columns"><div><span>Retailer-visible fields</span><p>Order ID, items, quantities, requested brands, slot, zone</p></div><div><span>Excluded customer fields</span><p class="never">Name, phone, address</p></div></div></div></div>`;
    }
    function synonymsTable() {
      return `<div class="table-scroll"><table><thead><tr><th>Phrase</th><th>Resolves to</th><th>Rule type</th></tr></thead><tbody>${SYNONYMS.map(([phrase, resolution, type]) => `<tr><td><strong>${phrase}</strong></td><td>${resolution}</td><td><span class="badge ${type === 'Mishearing' ? 'orange' : type === 'Brand lock' ? 'gold' : ''}">${type}</span></td></tr>`).join('')}</tbody></table></div>`;
    }
    function dataView() {
      const tabs = [['stores', 'Stores · 18'], ['catalogue', 'Catalogue · 150'], ['synonyms', `Synonyms · ${SYNONYMS.length}`], ['schema', `Schema · ${SCHEMA_TABLES.length}`]];
      let content = dataTab === 'stores' ? storesTable() : dataTab === 'catalogue' ? catalogueTable() : dataTab === 'schema' ? schemaTable() : synonymsTable();
      return `${pageHeader('Seed data', 'Kothrud launch records loaded in the local demo.', '<span class="badge">411038</span>')}<section class="panel"><div class="data-toolbar" role="tablist" aria-label="Seed data collection">${tabs.map(([key, label]) => `<button class="filter-button" type="button" role="tab" data-data-tab="${key}" aria-selected="${dataTab === key}" aria-pressed="${dataTab === key}">${label}</button>`).join('')}</div>${content}</section>`;
    }
    function configView() {
      return `${pageHeader('Configuration', 'Launch values stored in this browser for the demo.', '<span class="badge orange">Ops only</span>')}<form class="panel" id="config-form"><div class="panel-head"><h2>Platform defaults</h2><span class="badge">Local config table</span></div><div class="panel-body"><div class="config-grid">${CONFIG_FIELDS.map(([key, label, unit, note]) => `<div class="config-field"><div><label for="cfg-${key}">${label}</label><small>${note}</small></div>${unit === 'boolean' ? `<input id="cfg-${key}" name="${key}" type="checkbox" value="true" ${state.config[key] ? 'checked' : ''} aria-label="${label}">` : `<input id="cfg-${key}" name="${key}" type="number" min="0" step="1" value="${esc(state.config[key])}" aria-label="${label} (${unit})">`}</div>`).join('')}</div><div class="config-actions"><button class="button" type="reset">Discard changes</button><button class="button primary" type="submit">Save configuration</button></div></div></form>`;
    }
    function renderLogin() {
      document.getElementById('session-name').textContent = '';
      document.getElementById('switch-account').hidden = true;
      document.getElementById('app').innerHTML = `<section class="login-wrap"><div class="login-intro"><h1>A local foundation<br>for <span>Kothrud.</span></h1><p>Phase 1 seed environment for BachatBazaar. Choose a demo role to inspect the foundation.</p></div><div class="role-grid">${Object.entries(ACCOUNTS).map(([key, account]) => `<button class="role-card" type="button" data-account="${key}" data-role="${key}">${roleIcon(key)}<span><strong>${account.role}</strong><small>${account.name}<br>${account.description}</small></span></button>`).join('')}</div><div class="login-foot"><i class="status-dot"></i>Local mock data · no external services connected</div></section>`;
    }
    function renderApp() {
      const account = ACCOUNTS[state.account];
      document.getElementById('session-name').textContent = `${account.name} · ${account.role}`;
      document.getElementById('switch-account').hidden = false;
      const navItems = [['overview', 'Overview', 'overview'], ...(state.account === 'ops' ? [['data', 'Seed data', 'data'], ['config', 'Configuration', 'config']] : [])];
      const content = activeTab === 'data' ? dataView() : activeTab === 'config' && state.account === 'ops' ? configView() : roleOverview();
      document.getElementById('app').innerHTML = `<div class="app-shell"><aside class="side"><div class="zone-card"><div class="eyebrow">Launch zone</div><h2>Kothrud, Pune</h2><p>PIN 411038</p></div><nav class="side-nav" aria-label="Main navigation">${navItems.map(([key, label, icon]) => `<button class="nav-button" type="button" data-tab="${key}" aria-current="${activeTab === key ? 'page' : 'false'}">${ICONS[icon]}${label}</button>`).join('')}</nav><div class="side-note">Phase 1 foundation<br>Local data snapshot · v1</div></aside><section class="main-content">${content}</section></div>`;
    }
    function render() { state.account ? renderApp() : renderLogin(); }

    document.getElementById('app').addEventListener('click', event => {
      const accountButton = event.target.closest('[data-account]');
      if (accountButton) {
        state.account = accountButton.dataset.account;
        activeTab = 'overview';
        persist();
        render();
        return;
      }
      const navButton = event.target.closest('[data-tab]');
      if (navButton) {
        activeTab = navButton.dataset.tab;
        render();
        return;
      }
      const dataButton = event.target.closest('[data-data-tab]');
      if (dataButton) {
        dataTab = dataButton.dataset.dataTab;
        render();
        return;
      }
      const languageButton = event.target.closest('[data-language]');
      if (languageButton) {
        state.language = languageButton.dataset.language;
        persist();
        render();
        return;
      }
      const voiceButton = event.target.closest('[data-voice]');
      if (voiceButton) {
        const action = voiceButton.dataset.voice;
        if (action === 'toggle') { toggleVoiceInput(); return; }
        if (action === 'sample') customerDraft.text = 'do kilo aadha atta, ek litre doodh, aadha kilo cheeni, tata nano, fortune wala tel ek litre, bada packet';
        if (action === 'parse' || action === 'sample') parseCustomerDraft();
        if (action === 'clear') customerDraft = { text: '', items: [], unknown: [], listening: false, error: '' };
        render();
        return;
      }
      const removeLine = event.target.closest('[data-remove-line]');
      if (removeLine) {
        customerDraft.items.splice(Number(removeLine.dataset.removeLine), 1);
        render();
        return;
      }
      const removeUnknown = event.target.closest('[data-remove-unknown]');
      if (removeUnknown) {
        customerDraft.unknown.splice(Number(removeUnknown.dataset.removeUnknown), 1);
        render();
      }
    });
    document.getElementById('app').addEventListener('input', event => {
      if (event.target.id === 'voice-text') customerDraft.text = event.target.value;
    });
    document.getElementById('app').addEventListener('submit', event => {
      if (event.target.id !== 'config-form') return;
      event.preventDefault();
      const formData = new FormData(event.target);
      const next = { ...state.config };
      for (const [key, , unit] of CONFIG_FIELDS) {
        if (unit === 'boolean') { next[key] = formData.get(key) === 'true'; continue; }
        const parsed = Number(formData.get(key));
        if (!Number.isFinite(parsed) || parsed < 0) { showToast('Enter valid non-negative values for every setting.'); return; }
        next[key] = parsed;
      }
      state.config = next;
      persist();
      render();
      showToast('Configuration saved to local demo data.');
    });
    document.getElementById('app').addEventListener('reset', event => {
      if (event.target.id === 'config-form') window.setTimeout(() => render(), 0);
    });
    document.getElementById('switch-account').addEventListener('click', () => {
      state.account = null;
      activeTab = 'overview';
      persist();
      render();
    });
    window.addEventListener('storage', event => {
      if (event.key === STORE_KEY) { state = loadState(); render(); }
    });
    render();
  </script>
  <script src="full-app.js?v=20261010-brand2"></script>
</body>
